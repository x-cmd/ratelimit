      - id: vercel-gb-hours-formula
        question:
          en: How is the Vercel GB-hours quota calculated?
        answer:
          en: |
            GB-hours = (memory in GB) × (execution time in hours) ×
            (number of invocations). Example: 256 MB function,
            100k invocations/month, average 2 seconds each =
            0.256 × (2/3600) × 100000 ≈ 14.2 GB-hours. Hobby is
            100 GB-hr/month; Pro is 1000 GB-hr/month. Lower memory
            = lower per-invocation cost but higher OOM risk on
            memory-intensive paths.
        confidence: 9
        reference:
          - docs/6-vercel.en.md

      - id: vercel-402-vs-500
        question:
          en: How do I distinguish a Vercel plan-cap from a code error?
        answer:
          en: |
            HTTP 402 = plan-cap exceeded (Hobby's 100 GB-hr/mo or
            Pro's 1000 GB-hr/mo). HTTP 500 = code error in your
            function. HTTP 504 = function timeout. These need
            different alert routing: 402 should page billing /
            growth team (capacity issue), 500 should page on-call
            (code bug), 504 should page on-call but indicates a
            perf issue rather than correctness.
        confidence: 9
        reference:
          - docs/6-vercel.en.md

      - id: vercel-edge-vs-serverless
        question:
          en: When should I use Edge Functions vs Serverless Functions?
        answer:
          en: |
            Edge Functions: V8 isolates, low per-invocation cost,
            hard 1MB code size, fast cold start. Use for
            request-time middleware — auth checks, A/B test
            assignment, routing decisions, geolocation-based
            redirects. Serverless Functions: full Node.js /
            Python / Go runtime, higher per-invocation cost,
            higher ceiling. Use for compute-heavy paths — image
            processing, PDF generation, anything CPU-intensive
            or library-heavy. They have separate quotas on the
            same plan.
        confidence: 8
        reference:
          - docs/6-vercel.en.md

      - id: vercel-vs-cloudflare-pages
        question:
          en: Vercel or Cloudflare Pages for frontend hosting?
        answer:
          en: |
            Both are excellent for static / JAMstack frontends; the
            choice is about framework fit and total cost.

            **Vercel wins on Next.js DX.** The team behind
            Next.js also builds Vercel; deployment is git-push,
            preview branches automatic, image optimization
            built-in. Best for: Next.js / Astro / SvelteKit
            projects where the framework integration matters.

            **Cloudflare Pages wins on cost and integration.**
            Free tier includes unlimited static sites; the same
            Cloudflare account gives you Workers (edge compute),
            KV (key-value), R2 (S3-compatible storage), Images.
            Best for: non-Next.js static sites, projects where
            you want one provider for both edge and frontend.

            **Rate-limit-wise**, both are unmetered for normal
            traffic. Vercel has 100 deployments/day on Hobby;
            Cloudflare Pages has unlimited. If you're deploying
            many times daily, Cloudflare Pages is friendlier.

            **Hybrid pattern:** Vercel for the Next.js frontend,
            Cloudflare in front as the CDN/DNS/WAF layer. Common
            for production SaaS with non-trivial edge logic.
        confidence: 8
        reference:
          - docs/6-vercel.en.md
          - docs/1-cloudflare.en.md

      - id: vercel-vs-cloudflare-vs-aws-amplify
        question:
          en: Vercel vs Cloudflare Pages vs AWS Amplify for frontend hosting?
        answer:
          en: |
            Three reasonable choices, with different ecosystems.

            **Vercel:** best DX for Next.js, opinionated
            platform. Most cost-predictable. Best when Next.js is
            the framework.

            **Cloudflare Pages:** cheapest at scale (free tier
            includes unlimited static sites), tightest edge
            integration with Workers / KV / R2. Best when
            Cloudflare is already your edge provider.

            **AWS Amplify:** native integration with AWS
            services (Cognito, AppSync, Lambda, etc.). Hosting
            is fine; the value-add is the AWS-stack glue. Best
            when the rest of the stack is on AWS.

            **Rate-limit-wise:** all three are unmetered for
            traffic. Deploy limits differ: Vercel Hobby 100/day,
            Cloudflare Pages unlimited, AWS Amplify build minutes
            per account. If your bottleneck is build minutes or
            deployment frequency, Cloudflare Pages is most
            generous.
        confidence: 8
        reference:
          - docs/6-vercel.en.md
          - docs/1-cloudflare.en.md

