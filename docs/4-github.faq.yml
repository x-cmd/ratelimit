id: x-ratelimit-4-github

<data>:
  - name:
      en: github
    qa:
      - id: github-rest-quota-unauth-vs-auth
        question:
          en: What's the difference between authenticated and unauthenticated GitHub REST quotas?
        answer:
          en: |
            Unauthenticated: 60 requests/hour per source IP. Authenticated
            (PAT, OAuth, GitHub App user-to-server): 5000 requests/hour
            per token / per installation. The ratio is roughly 80x
            — always use authentication if you're hitting the
            unauthenticated limit. Unauthenticated is for one-off
            public data fetches; anything serious needs a token.
        confidence: 10
        reference:
          - docs/4-github.en.md

      - id: github-secondary-rate-limit
        question:
          en: What's GitHub's "secondary rate limit" and how is it different from the primary?
        answer:
          en: |
            Primary: 5000 req/hr (or 60/hr unauth). Tracked explicitly;
            visible via X-RateLimit-Remaining. Secondary: heuristic
            abuse detection. No published threshold; triggers on
            bursts (e.g., 100 requests in parallel even with
            primary headroom), concurrent in-flight, repeated
            identical-content requests. Response is the same 429
            + Retry-After, but you can't tell which limit was
            hit from the response alone. Avoid secondary by
            spacing requests, using conditional requests
            (If-None-Match), and not tight-polling.
        confidence: 9
        reference:
          - docs/4-github.en.md

      - id: github-graphql-points
        question:
          en: How does GraphQL cost-based rate limiting work?
        answer:
          en: |
            5000 points per hour per token/installation. Each
            query costs 1-10 points depending on its highest-cost
            field. Connection fields and aggregation fields cost
            more than simple field reads. Inspect actual cost with
            `cost { totalCost }` in your query. Minimize cost by
            requesting fewer connections per query (paginate
            explicitly instead of relying on deep nesting).
        confidence: 9
        reference:
          - docs/4-github.en.md

      - id: github-reset-epoch-vs-seconds
        question:
          en: What's the format of X-RateLimit-Reset?
        answer:
          en: |
            UNIX epoch timestamp in seconds, NOT seconds-until-
            reset. To compute wait time: `wait = max(reset - now, 1)`.
            This trips up many first-time consumers who assume
            it's a relative value like "Retry-After".
        confidence: 10
        reference:
          - docs/4-github.en.md
