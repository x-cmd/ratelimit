      - id: github-not-covered-graphql-field-cost
        question:
          cn: "GitHub GraphQL 各字段的成本表？"
          en: "GitHub GraphQL field cost table?"
        answer:
          cn: |
            GitHub 官方文档列了每个 GraphQL 字段的成本（1-10 点）：

            - **Connection 字段**（如 `issues.first`、`comments.first`）：1-10 点
            - **Aggregation 字段**（如 `reactions.groupBy`）：更贵
            - **Object 字段**（如 `repository.name`）：1 点

            优化技巧：
            - 减少嵌套深度
            - 用显式分页（带 cursor）而非深度 `first`
            - 避免在单查询里 fetch 太多 connection
            - 看 `rateLimit { cost }` 字段确认实际成本

            完整字段成本表：[GraphQL resource limitations](https://docs.github.com/en/graphql/overview/resource-limitations)
          en: |
            GitHub's official docs list cost for each GraphQL field (1-10 points):

            - **Connection fields** (e.g., `issues.first`, `comments.first`): 1-10 points
            - **Aggregation fields** (e.g., `reactions.groupBy`): more expensive
            - **Object fields** (e.g., `repository.name`): 1 point

            Optimization tips:
            - Reduce nesting depth
            - Use explicit pagination (with cursor) instead of deep `first`
            - Avoid fetching too many connections in one query
            - Check `rateLimit { cost }` field for actual cost

            Full field cost table: [GraphQL resource limitations](https://docs.github.com/en/graphql/overview/resource-limitations)
        confidence: 9
        reference:
          - https://docs.github.com/en/graphql/overview/resource-limitations