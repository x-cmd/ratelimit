id: x-ratelimit-2-cloudflare

<data>:
  - name:
      en: cloudflare
    qa:
      - id: cloudflare-status-cf-mitigated-matrix
        question:
          en: How do I read a Cloudflare response — status code or cf-mitigated?
        answer:
          en: |
            **Both axes — not status code alone.**

            | Status | cf-mitigated | Meaning |
            |---|---|---|
            | 429 | (none) | REST API quota: 1200 req / 5 min / token |
            | 429 | rate-limit | Zone-level rate-limit rule |
            | 403 | challenge | WAF challenge (CAPTCHA / JS) |
            | 403 | block | WAF direct block |
            | 403 | bot | Bot Management triggered |
            | 403 | ip | IP-based rule |
            | 403 | country | Country-based rule |
            | 200 | challenge | JS challenge page (HTML) |

            The (status, cf-mitigated) pair tells you what kind of
            response it is. Status alone is ambiguous: 429 can be
            quota or rate-limit rule; 403 can be any of challenge /
            block / bot / ip / country.
        confidence: 10
        reference:
          - docs/2-cloudflare.en.md

      - id: cloudflare-rest-quota-free-vs-pro
        question:
          en: Is Cloudflare's REST API quota different between Free and Pro?
        answer:
          en: |
            No — both Free and Pro get 1200 requests / 5 min / API
            token. The differentiation between plans is on the
            consumer side (HTTP request caps per zone, Workers
            quota, KV/R2/D1 limits), not on the operator-side API
            quota. Enterprise plans have custom quotas negotiated
            separately.
        confidence: 10
        reference:
          - docs/2-cloudflare.en.md

      - id: cloudflare-per-token-quota-mechanic
        question:
          en: What does "per user" mean in Cloudflare's 1200 req / 5 min limit?
        answer:
          en: |
            **Per API token, not per Cloudflare account.**

            - One API token = one independent 1200 req / 5 min quota
            - Two API tokens = two independent quotas
            - CI teams give each job its own token so a runaway job
              doesn't take out the fleet
            - Legacy Global API Key (pre-2024) is single-shared —
              all scripts using it share one quota; that's why
              legacy CI keeps hitting 429
        confidence: 10
        reference:
          - docs/2-cloudflare.en.md

      - id: cloudflare-retry-after-format
        question:
          en: What's the format of Cloudflare's Retry-After header?
        answer:
          en: |
            Integer seconds (e.g., `Retry-After: 60`). Cloudflare
            does NOT emit `X-RateLimit-*` / `X-RateLimit-Reset`
            like GitHub does. Watch the response status (429) +
            Retry-After; those are the only reliable signals.
        confidence: 9
        reference:
          - docs/2-cloudflare.en.md

      - id: cloudflare-cf-mitigated-recovery
        question:
          en: How do I recover from a Cloudflare cf-mitigated block?
        answer:
          en: |
            **Don't auto-retry.** cf-mitigated is pattern-matching
            by Cloudflare's WAF / Bot Management; retrying with the
            same client pattern keeps getting blocked.

            Recovery steps:

            1. **Slow cadence** — add human-like jitter to request
               timing.
            2. **Change User-Agent** — `python-requests/2.31.0` and
               `curl/8.4.0` are naked signals; real browsers send
               `Mozilla/5.0 ...`.
            3. **Rotate IP** — datacenter IPs and Tor exits have
               bad reputation.
            4. **Solve the challenge** — for `cf-mitigated:
               challenge` (not `block`), you may complete a CAPTCHA
               or JS challenge.
            5. **Different network** — same IP may keep getting
               flagged; switch networks.

            For `cf-mitigated: block`, there is no recovery path
            from within the response — you must change client
            identity (UA, IP) or pattern.
        confidence: 9
        reference:
          - docs/2-cloudflare.en.md

      - id: cloudflare-vs-aws-cloudfront
        question:
          en: Cloudflare or AWS CloudFront for edge / CDN?
        answer:
          en: |
            Different optimization targets.

            **Cloudflare wins on developer experience and global
            reach.** One-click setup, free tier, 200+ city anycast
            network. Strengths: DDoS protection (built-in, no extra
            cost), Workers for edge compute, R2 for S3-compatible
            storage, KV for low-latency key-value. Best for:
            greenfield projects, multi-cloud, edge-first
            architectures.

            **AWS CloudFront wins on AWS-stack integration.** If
            you're already on AWS (S3, Lambda, IAM, ACM certs),
            CloudFront ties in natively: signed URLs from S3,
            Lambda@Edge for request transforms, AWS Shield Advanced
            for higher-tier DDoS. Best for: AWS-centric stacks
            where every other piece of infra is already in AWS.

            **Rate-limit comparison is irrelevant for serving
            traffic** (both are unmetered for normal HTTP serving);
            the difference matters when you call CloudFront's API
            to invalidate caches or create distributions.
            Cloudflare's API is friendlier; AWS has stricter
            throttling on management-API calls.
        confidence: 8
        reference:
          - docs/2-cloudflare.en.md