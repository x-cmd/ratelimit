id: x-ratelimit-7-rate-limit-headers-cheatsheet

<data>:
  - name:
      en: rate-limit-headers
    qa:
      - id: x-ratelimit-reset-format
        question:
          en: What's the format of X-RateLimit-Reset?
        answer:
          en: |
            UNIX epoch timestamp in seconds (not milliseconds).
            NOT seconds-until-reset. To compute wait time:
            `wait = max(reset_at - now(), 1)`. This is the
            most common footgun across rate-limit libraries
            because Retry-After is relative seconds, but
            X-RateLimit-Reset is an absolute timestamp.
        confidence: 10
        reference:
          - docs/4-github.en.md
          - docs/7-rate-limit-headers-cheatsheet.en.md

      - id: rfc-9745-vs-x-ratelimit
        question:
          en: What's the difference between RFC 9745 and the historical X-RateLimit-* headers?
        answer:
          en: |
            RFC 9745 (finalized 2024) defines a single combined
            header: `RateLimit: limit=100, remaining=50, reset=60`
            where `reset` is seconds-until-reset. Historical
            `X-RateLimit-Limit / Remaining / Reset` are
            separate headers; `Reset` is an epoch timestamp.
            RFC 9745 fixes the epoch-vs-seconds ambiguity. Vercel
            uses lowercase `ratelimit-*` headers which match RFC
            9745 style. Most other vendors still use the X-prefixed
            historical style.
        confidence: 9
        reference:
          - docs/7-rate-limit-headers-cheatsheet.en.md

      - id: aliyun-no-headers
        question:
          en: How do I detect rate-limiting on Aliyun when they don't return standard headers?
        answer:
          en: |
            Aliyun returns HTTP 400 or 403 (NOT 429) with a
            response body containing a `Code` field. Parse the
            body and branch on the Code value: Throttling.User,
            Throttling.Api, or Throttling.CloudBox. Each tier
            needs a different backoff. Don't assume standard
            headers exist on Aliyun.
        confidence: 9
        reference:
          - docs/2-aliyun.en.md
